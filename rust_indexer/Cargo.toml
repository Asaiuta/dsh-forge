[package]
name = "dsh_forge_indexer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "dsh-forge clean-room AST symbol indexer (tree-sitter) — outline/symbol search over stdio JSON-lines"
license = "MIT"

# Grammar versions pin the tree-sitter ABI (15): upgrade core + grammars together.
[dependencies]
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "~0.25"
tree-sitter-c = "=0.24.2"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-lua = "=0.5.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true