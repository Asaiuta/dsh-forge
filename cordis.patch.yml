# dsh-forge bundle patch.
#
# Host-plane insert（dsh-ssh 同款第三方工具插件形态）：主入口（exports "."）
# 在 host 进程里经 inject ['tools','commands','fs','systemPrompt'] 注册 9 个
# agent 工具与 /forge-status 命令。apply 必须是 generator 函数（fork 对普通函数
# 会 new 构造并丢弃返回值），yield 的每个 disposer 由 cordis fork 的 _execute
# 收集。（fork 的 Context 上 `effect` 存在、`collect` 不存在——2026-10-11 的
# 启动失败根因是后者，注释此前把两者一起否定了。）
#
# 刻意**不**触碰 preset-standard：dsh-blackhole 的 patch 已对该行做了
# 「config 整体替换、不做深合并」的全量重述（见其 cordis.patch.yml [2] 段）。
# 两个全量重述互相覆盖，后应用者会抹掉先应用者的组内条目，所以 forge 的
# 工具只挂 host plane，绝不在 preset 层再插一份全量列表。
#
# 启动零开销：FFF 引擎懒启动——首次工具调用才建索引（ FinderPool 按工作区
# 根缓存），DSH 会话启动路径上没有任何本插件的工作。
#
# 设置（用户 patch 层覆盖本行即可，见 README「插件设置」）：
#   config:
#     registration: takeover           # 默认 additive：9 个工具都以 ff* 名并存
#     takeover: [read, glob, grep]     # 省略即取全部可接管项；edit 不在其列

- insert:
    - id: dsh-forge
      name: dsh-forge
    # 设置页的宿主侧通道（GET/POST /forge-config）。独立成一行，因为它 inject
    # ['webServer','configEditor']：headless / SDK profile 没有 webServer，这一行
    # 由 cordis 直接跳过，主行照常加载。保存走 configEditor.edit()（写 profile
    # patch + Loader 正常生命周期），registration/takeover 才会真正重新注册。
    - id: dsh-forge-http
      name: 'dsh-forge/http'
